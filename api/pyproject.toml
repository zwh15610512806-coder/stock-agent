[project]
name = "zhi-tou-terminal-api"
version = "0.1.0"
description = "FastAPI backend for ZhiTou Terminal."
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.18.64",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "tencentcloud-sdk-python-common>=3.1.111",
    "tencentcloud-sdk-python-ocr>=3.1.111",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
